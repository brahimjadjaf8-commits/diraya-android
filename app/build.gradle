plugins { id 'com.android.application' }

android {
    namespace 'com.jafjaf.maktabati'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jafjaf.maktabati'
        minSdk 24
        targetSdk 35
        versionCode 100
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
